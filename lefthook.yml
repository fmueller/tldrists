# Local git hooks for tldrists (opt-in).
#
# Install with `mise run setup` or `lefthook install`. CI remains authoritative.
pre-commit:
  parallel: true
  commands:
    author-identity:
      run: bash scripts/check-author.sh
    conflict-markers:
      run: |
        markers="$(git diff --cached -U0 -- {staged_files} | grep -E '^\+(<{7}|={7}|>{7})([[:space:]]|$)' || true)"
        if [ -n "$markers" ]; then
          echo "unresolved merge markers are staged:" >&2
          echo "$markers" >&2
          exit 1
        fi
    ruff:
      glob: "generator/**/*.py"
      run: uv run --directory generator ruff check
    ruff-format:
      glob: "generator/**/*.py"
      run: uv run --directory generator ruff format --check
    mypy:
      glob: "generator/**/*.py"
      run: uv run --directory generator mypy
    commit-message-checker:
      glob: "{lefthook.yml,scripts/check-commit-msg.sh,scripts/check-attribution.sh,scripts/check-commit-msg-test.sh}"
      run: bash scripts/check-commit-msg-test.sh
    push-message-checker:
      glob: "{lefthook.yml,scripts/check-push-messages.sh,scripts/check-attribution.sh,scripts/check-author.sh,scripts/check-push-messages-test.sh}"
      run: bash scripts/check-push-messages-test.sh
    author-checker:
      glob: "{lefthook.yml,scripts/check-author.sh,scripts/check-author-test.sh}"
      run: bash scripts/check-author-test.sh

commit-msg:
  commands:
    message-policy:
      run: bash scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    message-policy:
      priority: 1
      run: bash scripts/check-push-messages.sh
    tests:
      priority: 2
      run: uv run --directory generator pytest
