[project]
name = "tldrists-generator"
version = "0.1.0"
description = "The microblogging generator for TLDRists."
authors = [
    {name = "Felix Müller",email = "felix@fmueller.io"}
]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic >=2.11.7",
    "typer >=0.16.0",
    "pyyaml >=6.0.2",
    # The generator uses the pydantic-ai 1.x OpenAIModel API; migrate it before 2.x.
    "pydantic-ai-slim[openai] >=1.77.0,<2.0.0"
]

[project.scripts]
tldrists-gen = "tldrists_generator.cli:app"

[build-system]
requires = ["setuptools>=77", "packaging>=24.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "build>=1.3.0",
    "mypy>=1.20.0,<3.0.0",
    "ruff>=0.15.9,<0.16.0",
    "types-pyyaml>=6.0.12.20250915,<7.0.0",
    "pytest>=9.0.2,<10.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = "src/**/*.py,tests/**/*.py"
strict = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
