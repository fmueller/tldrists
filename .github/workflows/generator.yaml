name: Generator

on:
  push:
    branches: [ main ]
    paths:
      - "generator/**"
  pull_request:
    branches: [ main ]
    paths:
      - "generator/**"
  workflow_dispatch:

env:
  UV_VERSION: "0.12.17"
  WORKING_DIRECTORY: generator

jobs:
  lint-and-typecheck:
    name: Linting and Type Checking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Checkout internal prompts repo
        uses: actions/checkout@v7
        with:
          repository: fmueller/tldrists-internal
          token: ${{ secrets.PAT_INTERNAL_REPO }}
          path: generator/internal
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: generator/uv.lock
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: generator/.python-version
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run Ruff checks
        run: uv run ruff check
      - name: Check formatting
        run: uv run ruff format --check
      - name: Run mypy for type checking
        run: uv run mypy

  tests:
    name: Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: generator/uv.lock
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: generator/.python-version
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Run unit tests
        run: uv run pytest -v
